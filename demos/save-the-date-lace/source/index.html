<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save the Date Lace</title>
  <style>
    :root { font-family: Inter, Arial, sans-serif; background: #faf4ef; color: #302520; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(180deg, #fffaf5, #eadbd1); }
    main { min-height: 100vh; display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: 28px; width: min(1080px, 100%); margin: 0 auto; padding: 34px 18px; }
    .photo { min-height: 78vh; border: 1px solid rgba(70,45,32,.18); overflow: hidden; background: #e8d4c8; }
    .photo img { width: 100%; height: 100%; min-height: 78vh; object-fit: cover; display: block; }
    .copy { padding: 18px; }
    .eyebrow { margin: 0 0 18px; font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: #9b6b55; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(48px, 8vw, 108px); line-height: .9; font-weight: 400; }
    .date { margin: 24px 0 0; font-size: 18px; line-height: 1.7; letter-spacing: .14em; text-transform: uppercase; }
    .note { margin: 22px 0 0; max-width: 440px; font-size: 17px; line-height: 1.7; color: #5a463c; }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; padding-top: 18px; }
      .photo, .photo img { min-height: 54vh; }
      .photo { order: -1; }
    }
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <p class="eyebrow">Save the date</p>
      <h1>Lace</h1>
      <p class="date">Coming celebration</p>
      <p class="note">This local preview is ready to open without network access and uses only downloaded files from this folder.</p>
    </section>
    <section class="photo" aria-label="Save the date preview">
      <img src="../../save-the-date-candlelight/source/assets/inicio-camara-D3JixjJx.jpg" alt="">
    </section>
  </main>
</body>
</html>
