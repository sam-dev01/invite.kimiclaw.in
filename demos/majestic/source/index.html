<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Majestic</title>
  <style>
    :root { font-family: Inter, Arial, sans-serif; background: #111; color: #f7f1e8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #171411; }
    .hero { min-height: 92vh; display: grid; place-items: end start; padding: 7vw; position: relative; overflow: hidden; }
    .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,8,6,.86), rgba(10,8,6,.28), rgba(10,8,6,.66)); z-index: 1; }
    .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .92; }
    .content { position: relative; z-index: 2; max-width: 760px; }
    .eyebrow { margin: 0 0 16px; font-size: 12px; line-height: 1.4; letter-spacing: .24em; text-transform: uppercase; color: #d9bd8f; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(54px, 10vw, 128px); line-height: .86; font-weight: 400; }
    .sub { max-width: 560px; margin: 22px 0 0; font-size: clamp(17px, 2.4vw, 24px); line-height: 1.55; color: #efe1ce; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; width: min(1120px, 100%); margin: 0 auto; padding: 34px 18px 54px; }
    .card { min-height: 260px; border: 1px solid rgba(255,255,255,.13); background: #221c17; overflow: hidden; }
    .card img { width: 100%; height: 190px; object-fit: cover; display: block; }
    .card p { margin: 0; padding: 16px; color: #e8d8c3; line-height: 1.45; }
    @media (max-width: 760px) {
      .hero { min-height: 86vh; padding: 26px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <img src="assets/hero-template-majestic-D4H0kti9.webp" alt="">
    <div class="content">
      <p class="eyebrow">Wedding invitation</p>
      <h1>Majestic</h1>
      <p class="sub">A dramatic invitation preview with ceremony details, RSVP moments, and elegant visual sections ready to view from the downloaded files.</p>
    </div>
  </section>
  <section class="grid" aria-label="Invitation sections">
    <article class="card"><img src="assets/feature-screen-invitation-CQSm-1GQ.jpeg" alt=""><p>Invitation cover and couple details.</p></article>
    <article class="card"><img src="assets/feature-screen-rsvp-ubJq5b-t.jpeg" alt=""><p>RSVP section prepared for local viewing.</p></article>
    <article class="card"><img src="assets/feature-screen-map-iAZSF3BO.webp" alt=""><p>Schedule and venue information layout.</p></article>
  </section>
</body>
</html>
