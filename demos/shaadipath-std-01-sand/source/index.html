        const off = document.createElement('canvas');
        off.width = SW; off.height = SH;
        const octx = off.getContext('2d');
        octx.drawImage(img, 0, 0, SW, SH);
        const data = octx.getImageData(0, 0, SW, SH).data;
        const samples = [];
        for (let i = 0; i < 220; i++) {
          const x = (Math.random() * SW) | 0;
          const y = (Math.random() * SH) | 0;
          const o = (y * SW + x) * 4;
          const r = data[o], g = data[o + 1], b = data[o + 2], a = data[o + 3];
          if (a < 200) continue;                  // skip transparent edge
          if (r + g + b > 720) continue;          // skip near-white halos
          samples.push(`rgb(${r},${g},${b})`);
        }
        if (samples.length > 30) paletteRef.current = samples;
      } catch (_) { /* CORS fallback */ }
      resize();
    };
    img.onerror = () => setSupported(false);
    img.src = sandUrl;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (sandImgRef.current) {
        ctx.globalCompositeOperation = 'source-over';
        // Lay down a solid teal underlay so the entire oval is opaque even where
        // the sand PNG has transparent edges, then draw the sand texture scaled
        // up to cover the canvas fully (crops out the PNG's transparent border).
        ctx.fillStyle = '#0f6473';
        ctx.fillRect(0, 0, rect.width, rect.height);
        const scale = 1.22;
        const dw = rect.width * scale;
        const dh = rect.height * scale;
        const dx = (rect.width - dw) / 2;
        const dy = (rect.height - dh) / 2;
        ctx.drawImage(sandImgRef.current, dx, dy, dw, dh);
      }
    }

    const ro = new ResizeObserver(resize);
    ro.observe(canvas);
    return () => ro.disconnect();
  }, [sandUrl]);

  // Particle canvas sizing
  useEffect(() => {
    const pc = particleCanvasRef.current;
    if (!pc) return;
    const pctx = pc.getContext('2d');
    function resizeP() {
      const rect = pc.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      pc.width = Math.max(1, Math.round(rect.width * dpr));
      pc.height = Math.max(1, Math.round(rect.height * dpr));
      pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeP();
    const ro = new ResizeObserver(resizeP);
    ro.observe(pc);
    return () => { ro.disconnect(); if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, []);

  // Particle tick loop
  const ensureLoop = () => {
    if (rafRef.current != null) return;
    lastTRef.current = performance.now();
    const step = (t) => {
      const pc = particleCanvasRef.current;
      if (!pc) { rafRef.current = null; return; }
      const pctx = pc.getContext('2d');
      const rect = pc.getBoundingClientRect();
      const dt = Math.min(0.05, (t - lastTRef.current) / 1000);
      lastTRef.current = t;
      pctx.clearRect(0, 0, rect.width, rect.height);
      const parts = particlesRef.current;
      const next = [];
      for (let i = 0; i < parts.length; i++) {
        const p = parts[i];
        p.vy += 620 * dt;            // gravity (sand falls fast)
        p.vx *= (1 - 1.2 * dt);      // strong air drag for fine grain
        p.vy *= (1 - 0.4 * dt);
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life > 0 && p.y < rect.height + 8) {
          const a = Math.max(0, p.life / p.maxLife) * (p.alpha || 0.8);
          pctx.globalAlpha = a;
          pctx.fillStyle = p.color;
          pctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
          next.push(p);
        }
      }
      pctx.globalAlpha = 1;
      particlesRef.current = next;
      if (next.length > 0) {
        rafRef.current = requestAnimationFrame(step);
      } else {
        rafRef.current = null;
      }
    };
    rafRef.current = requestAnimationFrame(step);
  };

  // Convert scratch-canvas coords to particle-canvas coords (particle canvas is
  // wider via inset: -22% so grains can scatter outside the oval).
  const PAD = 0.22;
  const spawnParticles = (x, y, count, dx, dy) => {
    const scratch = canvasRef.current;
    if (!scratch) return;
    const rect = scratch.getBoundingClientRect();
    const offX = rect.width * PAD;
    const offY = rect.height * PAD;
    const px = x + offX;
    const py = y + offY;
    const speed = Math.hypot(dx, dy);
    const dirX = speed > 0.01 ? dx / speed : (Math.random() * 2 - 1);
    const dirY = speed > 0.01 ? dy / speed : -1;
    const palette = paletteRef.current;
    const parts = particlesRef.current;
    for (let i = 0; i < count; i++) {
      // direction: along stroke with spread; gentle outward arc, not a fountain
      const spread = (Math.random() - 0.5) * 1.6;
      const cs = Math.cos(spread), sn = Math.sin(spread);
      const vx0 = dirX * cs - dirY * sn;
      const vy0 = dirX * sn + dirY * cs;
      const power = 40 + Math.random() * 110 + Math.min(140, speed * 1.8);
      parts.push({
        x: px + (Math.random() - 0.5) * 8,
        y: py + (Math.random() - 0.5) * 8,
        vx: vx0 * power + (Math.random() - 0.5) * 30,
        vy: vy0 * power - 12 - Math.random() * 32, // tiny upward nudge, mostly gravity
        rot: 0,
        vr: 0,
        size: 0.45 + Math.random() * 0.95,         // fine grain
        color: palette[(Math.random() * palette.length) | 0],
        alpha: 0.55 + Math.random() * 0.35,
        life: 0.55 + Math.random() * 0.7,
        maxLife: 1,
      });
      parts[parts.length - 1].maxLife = parts[parts.length - 1].life;
    }
    // cap particles
    if (parts.length > 800) parts.splice(0, parts.length - 800);
    ensureLoop();
  };

  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top,
    };
  };

  const eraseAt = (x, y) => {
    const ctx = canvasRef.current.getContext('2d');
    const r = Math.max(22, Math.min(28, canvasRef.current.getBoundingClientRect().width * 0.085));
    ctx.globalCompositeOperation = 'destination-out';
    // soft circular brush
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(0.6, 'rgba(0,0,0,0.85)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  };

  const eraseLine = (a, b) => {
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    const r = Math.max(22, Math.min(28, canvasRef.current.getBoundingClientRect().width * 0.085));
    const step = Math.max(2, r * 0.35);
    const steps = Math.max(1, Math.floor(dist / step));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      eraseAt(a.x + dx * t, a.y + dy * t);
    }
    // sand scatter â€” count proportional to stroke length (dense grain cloud)
    const n = Math.min(28, Math.max(6, Math.round(dist / 2.2)));
    spawnParticles(b.x, b.y, n, dx, dy);
  };

  const checkPercent = () => {
    const canvas = canvasRef.current;
    if (!canvas) return 0;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    // sample at low resolution for perf
    const sw = 32, sh = 32;
    const off = document.createElement('canvas');
    off.width = sw; off.height = sh;
    const octx = off.getContext('2d');
    octx.drawImage(canvas, 0, 0, sw, sh);
    const data = octx.getImageData(0, 0, sw, sh).data;
    // only count pixels inside the oval mask
    let total = 0, cleared = 0;
    const cx = sw / 2, cy = sh / 2, rx = sw / 2, ry = sh / 2;
    for (let y = 0; y < sh; y++) {
      for (let x = 0; x < sw; x++) {
        const nx = (x - cx) / rx, ny = (y - cy) / ry;
        if (nx * nx + ny * ny > 1) continue;
        total++;
        const a = data[(y * sw + x) * 4 + 3];
        if (a < 32) cleared++;
      }
    }
    return total ? cleared / total : 0;
  };

  const finish = useCallback(() => {
    if (completedRef.current) return;
    completedRef.current = true;
    // clear remaining via fade then full clear
    setGone(true);
    setTimeout(() => {
      const canvas = canvasRef.current;
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      onComplete && onComplete();
    }, 650);
  }, [onComplete]);

  const onPointerDown = (e) => {
    if (completedRef.current) return;
    e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId);
    drawingRef.current = true;
    setHintHidden(true);
    document.body.classList.add('scratching');
    const p = getPos(e);
    lastPtRef.current = p;
    eraseAt(p.x, p.y);
    // initial puff of grains
    spawnParticles(p.x, p.y, 20, 0, -1);
  };

  const onPointerMove = (e) => {
    if (!drawingRef.current || completedRef.current) return;
    e.preventDefault();
    const p = getPos(e);
    const last = lastPtRef.current || p;
    eraseLine(last, p);
    lastPtRef.current = p;

    // throttle percent check
    const now = performance.now();
    if (now - lastCheckRef.current > 300) {
      lastCheckRef.current = now;
      const pct = checkPercent();
      if (pct >= 0.5) finish();
    }
  };

  const onPointerUp = (e) => {
    drawingRef.current = false;
    lastPtRef.current = null;
    document.body.classList.remove('scratching');
    try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
    // one more check on lift
    if (!completedRef.current) {
      const pct = checkPercent();
      if (pct >= 0.5) finish();
    }
  };

  if (!supported) {
    return (
      <button
        className="fallback-btn"
        onClick={() => { setGone(true); setTimeout(() => onComplete && onComplete(), 400); }}
      >Tap to Reveal</button>
    );
  }

  return (
    <React.Fragment>
      <canvas
        ref={canvasRef}
        className={`scratch-canvas ${gone ? 'gone' : ''}`}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={onPointerUp}
      />
      <canvas ref={particleCanvasRef} className={`particle-canvas ${gone ? 'gone' : ''}`} />
      <div className={`scratch-hint ${hintHidden || gone ? 'hidden' : ''}`}>
        <div className="inscription">
          <div className="flourish">
            <span className="line" />
            <span className="glyph">âœ¦</span>
            <span className="line" />
          </div>
          <div className="text">gently scratch to reveal</div>
        </div>
      </div>
    </React.Fragment>
  );
}

function SaveTheDate({
  coupleName = 'Chitra & Prateek',
  date = '14 June 2026',
  venue = 'The Westin Sohna',
  city = 'Gurgaon, Haryana',
  calendarUrl = 'assets/render-62d8b1ff52.bin',
  ctaText = 'Save to Google Calendar',
  showVenue = true,
  showCity = true,
  showCta = true,
  onComplete,
}) {
  // phase: 'intro' | 'fading' | 'card'
  const _gallery = !!(window.__STD_GALLERY_MODE__);
  const [phase, setPhase] = useState(_gallery ? 'card' : 'intro');
  const [tapped, setTapped] = useState(false);
  const [cardIn, setCardIn] = useState(_gallery);
  const [revealed, setRevealed] = useState(false);
  const videoRef = useRef(null);

  // parse date for display
  const dateParts = (() => {
    const m = /^(\d+)\s+(\w+)\s+(\d{4})$/.exec(date.trim());
    if (m) return { day: m[1].padStart(2, '0'), month: m[2], year: m[3] };
    return { day: '14', month: 'June', year: '2026' };
  })();

  // split couple name
  const coupleParts = (() => {
    const m = /^(.+?)\s*&\s*(.+)$/.exec(coupleName);
    return m ? { a: m[1], b: m[2] } : { a: coupleName, b: '' };
  })();

  const handleIntroTap = () => {
    if (tapped) return;
    setTapped(true);
    const v = videoRef.current;
    if (!v) return;
    v.muted = true; // allow autoplay
    v.play().catch(() => {
      // if play fails, just transition
      setPhase('fading');
      setTimeout(() => setPhase('card'), 1100);
    });
  };

  const handleVideoEnded = () => {
    setPhase('fading');
    setTimeout(() => {
      setPhase('card');
      // trigger card animation on next frame
      requestAnimationFrame(() => requestAnimationFrame(() => setCardIn(true)));
    }, 1100);
  };

  // seek to first frame once the browser has decoded data — currentTime=0.001 forces the frame to paint
  useEffect(() => {
    const v = videoRef.current;
    if (!v) return;
    const showFirstFrame = () => { v.currentTime = 0.001; };
    if (v.readyState >= 2) showFirstFrame();
    else v.addEventListener('loadeddata', showFirstFrame, { once: true });
    return () => v.removeEventListener('loadeddata', showFirstFrame);
  }, []);

  // when entering card, trigger entrance
  useEffect(() => {
    if (phase === 'card') {
      const t = setTimeout(() => setCardIn(true), 30);
      return () => clearTimeout(t);
    }
  }, [phase]);

  const onReveal = () => {
    setRevealed(true);
    onComplete && onComplete();
  };

  return (
    <div className="stage">
      {/* Intro */}
      {phase !== 'card' && (
        <div
          className={`intro ${phase === 'fading' ? 'fade-out' : ''}`}
          onClick={handleIntroTap}
        >
          <video
            ref={videoRef}
            src={window.__resources.introVideo}
            poster="assets/poster-d2510ef9c5.png"
            playsInline
            preload="auto"
            muted
            onEnded={handleVideoEnded}
          />
          <div className={`intro-overlay ${tapped ? 'hidden' : ''}`}>
            <div className="tap-to-begin">
              <div className="ornament">
                <span className="line" />
                <span className="dot" />
                <span className="line" />
              </div>
              <div className="label">Tap to Begin</div>
            </div>
          </div>
        </div>
      )}

      {/* Card */}
      {(phase === 'card' || phase === 'fading') && (
        <div className={`card ${cardIn ? 'in' : ''}`}>
          <div className="eyebrow">
            <span className="rule" />
            <span className="diamond" />
            <span className="rule" />
          </div>
          <h1 className="title">Save the Date</h1>
          <div className="couple">
            <span>{coupleParts.a}</span>
            <span className="amp"> &amp; </span>
            <span>{coupleParts.b}</span>
          </div>

          <div className="frame-wrap">
            <div className="inner">
              <div className={`glow ${revealed ? 'on' : ''}`} />
              <div className={`reveal ${revealed ? 'show' : ''}`} aria-hidden={!revealed}>
                <div className="preamble">on the</div>
                <div className="day">{dateParts.day}</div>
                <div className="month-row">
                  <span className="bar" />
                  <span className="month">{dateParts.month} {dateParts.year}</span>
                  <span className="bar" />
                </div>
                <div className="sep" />
                {showVenue && <div className="venue">{venue}</div>}
                {showCity && <div className="city">{city}</div>}
              </div>
              <ScratchCanvas
                sandUrl={window.__resources.sandImg}
                onComplete={onReveal}
              />
              <Sparkles on={revealed} />
            </div>
            <img
              src={window.__resources.frameImg}
              alt=""
              className="frame-img"
              draggable="false"
            />
          </div>

          <div className="formal">
            Formal invitation
            <span className="tilde">~</span>
            to follow
          </div>

          {showCta && (
            <div className="cta-wrap">
              <a
                className={`cta ${revealed ? 'show' : ''}`}
                href={calendarUrl}
                target="_blank"
                rel="noopener noreferrer"
                aria-hidden={!revealed}
                tabIndex={revealed ? 0 : -1}
              >
                <GoogleIcon />
                <span>{ctaText}</span>
              </a>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
const _cfg = window.__STD_CONFIG__ || {};
root.render(
  <SaveTheDate
    coupleName={_cfg.coupleName || 'Chitra & Prateek'}
    date={_cfg.date || '14 June 2026'}
    venue={_cfg.venue || 'The Westin Sohna'}
    city={_cfg.city || 'Gurgaon, Haryana'}
    calendarUrl={_cfg.calendarUrl || ''}
    ctaText={_cfg.ctaText || 'Save to Google Calendar'}
    showVenue={_cfg.showVenue !== false}
    showCity={_cfg.showCity !== false}
    showCta={_cfg.showCta !== false}
  />
);

</script>

}
</style>
<audio id="stdBgAudio" src="assets/std_demo_music-cfc265684d.mp3" loop preload="auto" playsinline crossorigin="anonymous"></audio>
<button id="stdMusicBtn" class="is-paused" aria-label="Toggle music">
  <span class="std-music-bar"></span><span class="std-music-bar"></span><span class="std-music-bar"></span>
</button>
<script>
(function () {
  var audio = document.getElementById('stdBgAudio');
  var btn   = document.getElementById('stdMusicBtn');
  if (!audio || !btn) return;
  audio.volume = 0.55;
  var started = false;

  function play() {
    var p = audio.play();
    if (p && typeof p.then === 'function') {
      p.then(function () { btn.classList.remove('is-paused'); started = true; })
       .catch(function () { btn.classList.add('is-paused'); });
    } else {
      btn.classList.remove('is-paused');
      started = true;
    }
  }
  function pause() {
    audio.pause();
    btn.classList.add('is-paused');
  }

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (audio.paused) play(); else pause();
  });

  function firstTap() {
    if (started) return;
    play();
    document.removeEventListener('pointerdown', firstTap, true);
    document.removeEventListener('touchstart',  firstTap, true);
    document.removeEventListener('click',       firstTap, true);
  }
  document.addEventListener('pointerdown', firstTap, true);
  document.addEventListener('touchstart',  firstTap, true);
  document.addEventListener('click',       firstTap, true);
})();
</script>
