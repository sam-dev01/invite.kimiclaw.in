<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save the Date Candlelight</title>
  <style>
    :root { font-family: Inter, Arial, sans-serif; background: #17110e; color: #fff7ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #1a130f; }
    main { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 32px; width: min(1080px, 100%); margin: 0 auto; padding: 34px 18px; }
    .photo { min-height: 80vh; border: 1px solid rgba(255,255,255,.14); overflow: hidden; background: #2b211b; }
    .photo img { width: 100%; height: 100%; min-height: 80vh; object-fit: cover; display: block; }
    .copy { padding: 20px 0; }
    .eyebrow { margin: 0 0 18px; font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: #d8b899; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(46px, 8vw, 104px); line-height: .9; font-weight: 400; }
    .date { margin: 24px 0 0; font-size: 18px; line-height: 1.7; letter-spacing: .14em; text-transform: uppercase; color: #f1dcc8; }
    .note { margin: 22px 0 0; max-width: 440px; font-size: 17px; line-height: 1.7; color: #d9c7b7; }
    .cupid { margin-top: 24px; width: 120px; height: auto; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; padding-top: 18px; } .photo, .photo img { min-height: 56vh; } .photo { order: -1; } }
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <p class="eyebrow">Save the date</p>
      <h1>Candlelight</h1>
      <p class="date">A celebration is coming</p>
      <p class="note">A warm candlelit preview using local downloaded artwork and photos only.</p>
      <img class="cupid" src="assets/nau-cupid-B7PGcLFc.png" alt="">
    </section>
    <section class="photo">
      <img src="assets/inicio-camara-D3JixjJx.jpg" alt="">
    </section>
  </main>
</body>
</html>
