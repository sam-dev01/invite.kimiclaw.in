<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premium Elegante</title>
  <style>
    :root { font-family: Inter, Arial, sans-serif; background: #fbf7f3; color: #2d2520; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(180deg, #fffaf6, #ead9cd); }
    main { width: min(1080px, 100%); margin: 0 auto; padding: 30px 18px 54px; }
    .hero { min-height: 88vh; display: grid; grid-template-columns: .92fr 1.08fr; gap: 28px; align-items: center; }
    .copy { padding: 18px 0; }
    .eyebrow { margin: 0 0 18px; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: #9b705b; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(48px, 8vw, 110px); line-height: .9; font-weight: 400; }
    p { margin: 22px 0 0; max-width: 500px; font-size: 18px; line-height: 1.7; color: #59473d; }
    .media { min-height: 76vh; border: 1px solid rgba(79,51,38,.16); overflow: hidden; background: #e7d3c8; }
    .media video, .media img { width: 100%; height: 100%; min-height: 76vh; object-fit: cover; display: block; }
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
    .gallery img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; }
    @media (max-width: 820px) { .hero { grid-template-columns: 1fr; } .media { order: -1; } .gallery { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="copy">
        <p class="eyebrow">Wedding invitation</p>
        <h1>Premium Elegante</h1>
        <p>An elegant local invitation preview with ceremony, gallery, and celebration details available from downloaded assets.</p>
      </div>
      <div class="media">
        <video src="assets/intro-video-new-XmwQeafK.mp4" poster="assets/intro-poster-new-BU7qGwfU.jpg" autoplay muted loop playsinline></video>
      </div>
    </section>
    <section class="gallery">
      <img src="assets/gallery-1-CndRyTXZ.jpg" alt="">
      <img src="assets/gallery-2-LJ9SqFT7.jpg" alt="">
      <img src="assets/gallery-3-BqTMMcNY.jpg" alt="">
    </section>
  </main>
</body>
</html>
