<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premium Selva</title>
  <style>
    :root { font-family: Inter, Arial, sans-serif; background: #f3f4e8; color: #182618; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(180deg, #fbf7e7, #d7e4c4); }
    main { width: min(1080px, 100%); margin: 0 auto; padding: 30px 18px 54px; }
    .hero { min-height: 88vh; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center; }
    .copy { position: relative; }
    .birds { width: min(360px, 80%); margin-bottom: 20px; }
    .eyebrow { margin: 0 0 16px; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: #6a6d2e; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(52px, 9vw, 116px); line-height: .86; font-weight: 400; }
    p { margin: 22px 0 0; max-width: 520px; font-size: 18px; line-height: 1.7; color: #344329; }
    .media { min-height: 76vh; border: 1px solid rgba(35,63,28,.18); overflow: hidden; background: #c9d7b0; }
    .media video, .media img { width: 100%; height: 100%; min-height: 76vh; object-fit: cover; display: block; }
    .icons { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 18px; }
    .icons img { width: 92px; height: 92px; object-fit: contain; }
    @media (max-width: 820px) { .hero { grid-template-columns: 1fr; } .media { order: -1; } }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="copy">
        <img class="birds" src="assets/jungle-birds-banner-BzUPxoty.png" alt="">
        <p class="eyebrow">Wedding invitation</p>
        <h1>Premium Selva</h1>
        <p>A tropical invitation preview with jungle artwork, celebration details, and local media ready for offline viewing.</p>
        <div class="icons">
          <img src="assets/toucan-illustration-2-BzsoE6MQ.png" alt="">
          <img src="assets/banana-icon-BIAfO0-4.png" alt="">
          <img src="assets/palm-tree-icon-Dw1mG7v9.png" alt="">
        </div>
      </div>
      <div class="media">
        <video src="assets/envelope-video-new-BGeqPCOC.mp4" poster="assets/envelope-poster-new-DvQ0Qf_2.jpg" autoplay muted loop playsinline></video>
      </div>
    </section>
  </main>
</body>
</html>
